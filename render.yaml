services:
  - type: web
    name: saasquatch-lead-intelligence-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: saasquatch_lead_intelligence
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
